<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Guru - Rekod Bacaan</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f1f5f9;
      margin: 0;
      padding: 20px;
      color: #0f172a;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #e2e8f0;
      padding-bottom: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      color: #0284c7;
    }
    .btn-logout {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    
    /* TOOLBAR CARIAN & FILTER */
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .toolbar input, .toolbar select {
      padding: 10px 14px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .toolbar input { flex: 2; min-width: 200px; }
    .toolbar select { flex: 1; min-width: 150px; }
    
    .btn-refresh {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* JADUAL SENARAI NAMA */
    .table-container {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }
    th {
      background-color: #f8fafc;
      color: #334155;
      font-weight: bold;
    }
    tr:hover {
      background-color: #f1f5f9;
    }
    .badge-score {
      background-color: #dcfce7;
      color: #15803d;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: bold;
      display: inline-block;
    }
    .loading-text {
      text-align: center;
      padding: 30px;
      font-weight: bold;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>📊 Rekod & Senarai Murid Menjawab</h1>
      <button class="btn-logout" onclick="logKeluar()">Log Keluar</button>
    </header>

    <!-- KAWASAN CARIAN & PENAPIS (FILTER) -->
    <div class="toolbar">
      <input type="text" id="search-input" placeholder="🔍 Cari nama murid..." onkeyup="tapisData()">
      <select id="filter-kelas" onchange="tapisData()">
        <option value="">-- Semua Kelas --</option>
        <option value="3 ARIF">3 ARIF</option>
        <option value="3 BESTARI">3 BESTARI</option>
        <option value="3 CERDIK">3 CERDIK</option>
        <option value="3 DEDIKASI">3 DEDIKASI</option>
        <option value="3 ELIT">3 ELIT</option>
        <option value="3 FIRDAUS">3 FIRDAUS</option>
        <option value="3 GIGIH">3 GIGIH</option>
        <option value="3 HARMONI">3 HARMONI</option>
        <option value="3 INOVATIF">3 INOVATIF</option>
        <option value="3 JUARA">3 JUARA</option>
        <option value="3 KREATIF">3 KREATIF</option>
      </select>
      <button class="btn-refresh" onclick="muatDataRekod()">🔄 Muat Semula</button>
    </div>

    <!-- JADUAL KEPUTUSAN -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Masa/Tarikh</th>
            <th>Nama Murid</th>
            <th>Kelas</th>
            <th>Modul</th>
            <th>Markah</th>
            <th>Peratus</th>
          </tr>
        </thead>
        <tbody id="rekod-body">
          <tr>
            <td colspan="7" class="loading-text">⏳ Memuatkan rekod murid... Sila tunggu.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

<script>
  // PENGESAHAN KATA LALUAN
  if (sessionStorage.getItem("guru_authenticated") !== "true") {
    alert("🔒 Akses disekat! Sila masukkan kata laluan di halaman utama terlebih dahulu.");
    window.location.href = "index.html";
  }

  const PAUTAN_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxCd2cvXVKr2ZuUswrZWVg19spQVISjI97vzHz8nPhLi5rwhd4ydhHHEfnJMGWH1kD7/exec";
  let senaraiRekod = [];

  // TARIK DATA APABILA HALAMAN DIBUKA
  window.onload = function() {
    muatDataRekod();
  };

  function muatDataRekod() {
    const tbody = document.getElementById('rekod-body');
    tbody.innerHTML = '<tr><td colspan="7" class="loading-text">⏳ Memuatkan rekod murid... Sila tunggu.</td></tr>';

    fetch(PAUTAN_APPS_SCRIPT)
      .then(res => res.json())
      .then(data => {
        senaraiRekod = data;
        paparJadual(senaraiRekod);
      })
      .catch(err => {
        console.error(err);
        tbody.innerHTML = '<tr><td colspan="7" class="loading-text" style="color:red;">❌ Gagal memuatkan data. Sila pastikan Google Apps Script dibuka untuk paparan umum.</td></tr>';
      });
  }

  function paparJadual(data) {
    const tbody = document.getElementById('rekod-body');
    tbody.innerHTML = '';

    if (!data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="loading-text">Belum ada murid yang menjawab.</td></tr>';
      return;
    }

    data.forEach((row, index) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${index + 1}</td>
        <td><small>${row[0] || '-'}</small></td>
        <td><b>${row[1] || '-'}</b></td>
        <td>${row[2] || '-'}</td>
        <td>${row[3] || '-'}</td>
        <td><span class="badge-score">${row[4] || '-'}</span></td>
        <td><b>${row[5] || '-'}</b></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function tapisData() {
    const carian = document.getElementById('search-input').value.toLowerCase();
    const kelasSelected = document.getElementById('filter-kelas').value;

    const dataDitapis = senaraiRekod.filter(row => {
      const nama = (row[1] || '').toString().toLowerCase();
      const kelas = (row[2] || '').toString();

      const padanNama = nama.includes(carian);
      const padanKelas = kelasSelected === "" || kelas === kelasSelected;

      return padanNama && padanKelas;
    });

    paparJadual(dataDitapis);
  }

  function logKeluar() {
    sessionStorage.removeItem("guru_authenticated");
    window.location.href = "index.html";
  }
</script>
</body>
</html>

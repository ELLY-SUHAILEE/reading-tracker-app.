<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuiz Bahasa Inggeris Tahun 3</title>
  <style>
    /* Rekabentuk Utama & Mesra Kanak-kanak */
    * { 
      box-sizing: border-box; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    }
    body { 
      background-color: #f0f9ff; 
      margin: 0; 
      padding: 20px; 
      color: #1e293b; 
    }
    .container { 
      max-width: 800px; 
      margin: 0 auto; 
      background: #ffffff; 
      padding: 25px; 
      border-radius: 16px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
    }
    
    /* Header & Butang Guru */
    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 3px solid #e2e8f0; 
      padding-bottom: 15px; 
      margin-bottom: 20px; 
    }
    h1 { 
      margin: 0; 
      font-size: 22px; 
      color: #0284c7; 
    }
    .btn-guru { 
      background-color: #4f46e5; 
      color: white; 
      padding: 10px 16px; 
      border: none; 
      border-radius: 8px; 
      font-weight: bold; 
      cursor: pointer; 
      transition: 0.2s; 
    }
    .btn-guru:hover { 
      background-color: #4338ca; 
    }

    /* Tab Pemilihan Set */
    .set-selector { 
      display: flex; 
      gap: 10px; 
      margin-bottom: 25px; 
    }
    .btn-set { 
      flex: 1; 
      padding: 12px; 
      border: 2px solid #0284c7; 
      background: #e0f2fe; 
      color: #0369a1; 
      font-weight: bold; 
      border-radius: 10px; 
      cursor: pointer; 
      font-size: 16px; 
      text-align: center; 
    }
    .btn-set.active { 
      background: #0284c7; 
      color: white; 
    }

    /* Kad Soalan & Pilihan Gambar */
    .question-card { 
      background: #f8fafc; 
      border: 1px solid #e2e8f0; 
      border-radius: 12px; 
      padding: 20px; 
      margin-bottom: 25px; 
    }
    .question-title { 
      font-size: 18px; 
      font-weight: bold; 
      margin-bottom: 15px; 
      color: #0f172a; 
    }

    .options-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
      gap: 15px; 
    }
    .option-card { 
      border: 3px solid #cbd5e1; 
      border-radius: 12px; 
      padding: 12px; 
      text-align: center; 
      cursor: pointer; 
      background: white; 
      transition: 0.2s; 
    }
    .option-card:hover { 
      border-color: #0284c7; 
      transform: translateY(-3px); 
    }
    .option-card.selected { 
      border-color: #0284c7; 
      background-color: #e0f2fe; 
    }
    .option-label { 
      font-size: 18px; 
      font-weight: bold; 
      margin-bottom: 8px; 
      display: block; 
    }
    .option-img { 
      width: 100%; 
      height: 160px; 
      object-fit: contain; 
      border-radius: 8px; 
    }
    
    /* Butang Hantar Jawapan */
    .btn-submit { 
      display: block; 
      width: 100%; 
      padding: 15px; 
      background: #16a34a; 
      color: white; 
      border: none; 
      border-radius: 10px; 
      font-size: 18px; 
      font-weight: bold; 
      cursor: pointer; 
      margin-top: 20px; 
    }
    .btn-submit:hover { 
      background: #15803d; 
    }

    /* Kotak Keputusan Markah */
    .result-box { 
      display: none; 
      text-align: center; 
      padding: 20px; 
      background: #f0fdf4; 
      border: 2px solid #22c55e; 
      border-radius: 12px; 
      margin-top: 20px; 
    }

    /* Popup Modal Kata Laluan Guru */
    .modal-overlay { 
      position: fixed; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      background: rgba(0,0,0,0.6); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      z-index: 999; 
    }
    .modal-card { 
      background: white; 
      padding: 25px; 
      border-radius: 14px; 
      width: 90%; 
      max-width: 350px; 
      text-align: center; 
    }
    .modal-card input { 
      width: 100%; 
      padding: 10px; 
      font-size: 16px; 
      margin: 15px 0 8px 0; 
      border: 2px solid #cbd5e1; 
      border-radius: 8px; 
      text-align: center; 
    }
    .modal-buttons { 
      display: flex; 
      gap: 10px; 
      justify-content: center; 
      margin-top: 10px; 
    }
    .btn-confirm { 
      background: #16a34a; 
      color: white; 
      padding: 10px 20px; 
      border: none; 
      border-radius: 8px; 
      font-weight: bold; 
      cursor: pointer; 
    }
    .btn-cancel { 
      background: #64748b; 
      color: white; 
      padding: 10px 20px; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
    }
    .error-msg { 
      color: #dc2626; 
      font-size: 13px; 
      display: none; 
      margin-bottom: 10px; 
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>📘 Kuiz Bahasa Inggeris Tahun 3</h1>
      <button class="btn-guru" onclick="bukaModalPassword()">🔒 Rekod Guru</button>
    </header>

    <!-- Tab Pilihan Set -->
    <div class="set-selector">
      <button class="btn-set active" id="btn-set-1" onclick="tukarSet(1)">SET 1</button>
      <button class="btn-set" id="btn-set-2" onclick="tukarSet(2)">SET 2</button>
    </div>

    <!-- Container Soalan -->
    <div id="quiz-box"></div>

    <button class="btn-submit" onclick="semakJawapan()">Hantar Jawapan</button>

    <!-- Keputusan -->
    <div id="result-box" class="result-box">
      <h2 id="result-score"></h2>
      <p id="result-message"></p>
    </div>
  </div>

  <!-- Popup Password Guru -->
  <div id="modal-password" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <h3>🔒 Akses Rekod Guru</h3>
      <p>Sila masukkan kata laluan guru:</p>
      <input type="password" id="input-password" placeholder="Masukkan kata laluan" onkeypress="semakEnter(event)">
      <p id="password-error" class="error-msg">Kata laluan salah! Sila cuba lagi.</p>
      <div class="modal-buttons">
        <button class="btn-confirm" onclick="sahkanPassword()">Masuk</button>
        <button class="btn-cancel" onclick="tutupModalPassword()">Batal</button>
      </div>
    </div>
  </div>

  <script>
    // 1. TUKAR KATA LALUAN GURU DAN PAUTAN GOOGLE SHEET ANDA DI SINI
    const KATA_LALUAN_GURU = "guru123";
    const PAUTAN_GOOGLE_SHEET = "https://docs.google.com/spreadsheets/d/1xxxxxx"; // Gantikan dengan URL Google Sheet anda

    let allQuestions = [];
    let currentSet = 1;
    let selectedAnswers = {};

    // 2. Muat turun soalan dari questions.json
    fetch('questions.json')
      .then(res => res.json())
      .then(data => {
        allQuestions = data;
        paparSetSoalan(currentSet);
      })
      .catch(err => {
        console.error('Ralat memuatkan questions.json:', err);
        document.getElementById('quiz-box').innerHTML = '<p style="color:red; text-align:center;">Ralat memuatkan soalan. Sila semak fail questions.json!</p>';
      });

    function tukarSet(setNo) {
      currentSet = setNo;
      selectedAnswers = {};
      document.getElementById('result-box').style.display = 'none';
      
      document.querySelectorAll('.btn-set').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-set-${setNo}`).classList.add('active');

      paparSetSoalan(setNo);
    }

    function paparSetSoalan(setNo) {
      const setData = allQuestions.find(s => s.set === setNo);
      const quizBox = document.getElementById('quiz-box');
      quizBox.innerHTML = '';

      if (!setData) {
        quizBox.innerHTML = '<p style="text-align:center;">Soalan untuk set ini belum wujud.</p>';
        return;
      }

      setData.questions.forEach((q, qIndex) => {
        const qCard = document.createElement('div');
        qCard.className = 'question-card';

        let optionsHTML = '';
        q.options.forEach(opt => {
          optionsHTML += `
            <div class="option-card" id="opt-${qIndex}-${opt.label}" onclick="pilihJawapan(${qIndex}, '${opt.label}')">
              <span class="option-label">(${opt.label})</span>
              <img src="${opt.image}" class="option-img" alt="Pilihan ${opt.label}">
            </div>
          `;
        });

        qCard.innerHTML = `
          <div class="question-title">${q.no}. ${q.sentence}</div>
          <div class="options-grid">${optionsHTML}</div>
        `;
        quizBox.appendChild(qCard);
      });
    }

    function pilihJawapan(qIndex, label) {
      selectedAnswers[qIndex] = label;
      const setData = allQuestions.find(s => s.set === currentSet);
      const question = setData.questions[qIndex];

      question.options.forEach(opt => {
        const card = document.getElementById(`opt-${qIndex}-${opt.label}`);
        if (card) {
          if (opt.label === label) {
            card.classList.add('selected');
          } else {
            card.classList.remove('selected');
          }
        }
      });
    }

    function semakJawapan() {
      const setData = allQuestions.find(s => s.set === currentSet);
      if (!setData) return;

      let score = 0;
      const total = setData.questions.length;

      if (Object.keys(selectedAnswers).length < total) {
        alert('Sila jawab semua soalan sebelum menghantar!');
        return;
      }

      setData.questions.forEach((q, qIndex) => {
        const userAns = selectedAnswers[qIndex];
        const correctOpt = q.options.find(o => o.is_correct);
        if (correctOpt && userAns === correctOpt.label) {
          score++;
        }
      });

      const resultBox = document.getElementById('result-box');
      const resultScore = document.getElementById('result-score');
      const resultMessage = document.getElementById('result-message');

      resultScore.innerText = `Markah Anda: ${score} / ${total}`;
      if (score === total) {
        resultMessage.innerText = 'Tahniah! Semua jawapan anda betul! 🎉';
      } else {
        resultMessage.innerText = 'Syabas! Cuba lagi untuk dapatkan markah penuh!';
      }
      resultBox.style.display = 'block';
    }

    /* Kawalan Modal Password Guru */
    function bukaModalPassword() {
      document.getElementById('input-password').value = '';
      document.getElementById('password-error').style.display = 'none';
      document.getElementById('modal-password').style.display = 'flex';
      document.getElementById('input-password').focus();
    }

    function tutupModalPassword() {
      document.getElementById('modal-password').style.display = 'none';
    }

    function sahkanPassword() {
      const input = document.getElementById('input-password').value;
      if (input === KATA_LALUAN_GURU) {
        tutupModalPassword();
        window.open(PAUTAN_GOOGLE_SHEET, '_blank');
      } else {
        document.getElementById('password-error').style.display = 'block';
      }
    }

    function semakEnter(event) {
      if (event.key === 'Enter') {
        sahkanPassword();
      }
    }
  </script>
</body>
</html>

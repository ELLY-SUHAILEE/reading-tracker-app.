<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Tracker App</title>
  <style>
    * { 
      box-sizing: border-box; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    }
    body { 
      background-color: #f0f9ff; 
      margin: 0; 
      padding: 20px; 
      color: #1e293b; 
    }
    .container { 
      max-width: 850px; 
      margin: 0 auto; 
      background: #ffffff; 
      padding: 25px; 
      border-radius: 16px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
    }
    
    /* Header & Butang Guru */
    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 3px solid #e2e8f0; 
      padding-bottom: 15px; 
      margin-bottom: 20px; 
    }
    h1 { 
      margin: 0; 
      font-size: 22px; 
      color: #0284c7; 
    }
    .btn-guru { 
      background-color: #4f46e5; 
      color: white; 
      padding: 10px 16px; 
      border: none; 
      border-radius: 8px; 
      font-weight: bold; 
      cursor: pointer; 
      transition: 0.2s; 
    }
    .btn-guru:hover { 
      background-color: #4338ca; 
    }

    /* SKRIN 1: HALAMAN UTAMA */
    .welcome-card {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      padding: 25px;
      text-align: center;
    }
    .welcome-card h2 {
      color: #0369a1;
      margin-top: 0;
    }
    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }
    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      color: #334155;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      background-color: white;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: #0284c7;
    }

    /* BUTANG MULA KUIZ */
    .btn-start {
      width: 100%;
      padding: 14px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.2s;
    }
    .btn-start:hover {
      background: #0369a1;
    }

    /* SKRIN 2: PAPARAN KUIZ */
    .quiz-header-info {
      background: #e0f2fe;
      border: 2px solid #0284c7;
      border-radius: 12px;
      padding: 15px 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .student-detail {
      font-size: 15px;
      color: #0369a1;
    }
    .btn-back {
      background: #64748b;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    /* KAD SOALAN & PILIHAN JAWAPAN */
    .question-card { 
      background: #f8fafc; 
      border: 1px solid #e2e8f0; 
      border-radius: 12px; 
      padding: 20px; 
      margin-bottom: 25px; 
    }
    .question-title { 
      font-size: 18px; 
      font-weight: bold; 
      margin-bottom: 15px; 
      color: #0f172a; 
    }
    .options-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
      gap: 15px; 
    }
    
    .option-card { 
      position: relative;
      border: 3px solid #cbd5e1; 
      border-radius: 14px; 
      padding: 12px; 
      text-align: center; 
      cursor: pointer; 
      background: white; 
      transition: all 0.2s ease-in-out; 
      user-select: none;
    }
    .option-card:hover { 
      border-color: #0284c7; 
      transform: translateY(-3px); 
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.15);
    }
    .option-card:active {
      transform: scale(0.97);
    }
    
    .option-card.selected { 
      border-color: #16a34a !important; 
      background-color: #f0fdf4 !important; 
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.2);
    }
    .option-card.selected::after {
      content: '✓';
      position: absolute;
      top: 8px;
      right: 12px;
      background: #16a34a;
      color: white;
      font-weight: bold;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .option-label { 
      font-size: 18px; 
      font-weight: bold; 
      margin-bottom: 8px; 
      display: block; 
      pointer-events: none;
    }
    .option-img { 
      width: 100%; 
      height: 160px; 
      object-fit: contain; 
      border-radius: 8px; 
      pointer-events: none;
    }
    
    .btn-submit { 
      display: block; 
      width: 100%; 
      padding: 15px; 
      background: #16a34a; 
      color: white; 
      border: none; 
      border-radius: 10px; 
      font-size: 18px; 
      font-weight: bold; 
      cursor: pointer; 
      margin-top: 20px; 
    }
    .btn-submit:hover { 
      background: #15803d; 
    }

    .result-box { 
      display: none; 
      text-align: center; 
      padding: 20px; 
      background: #f0fdf4; 
      border: 2px solid #22c55e; 
      border-radius: 12px; 
      margin-top: 20px; 
    }

    /* MODAL POPUP PASSWORD GURU */
    .modal-overlay { 
      position: fixed; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      background: rgba(0,0,0,0.6); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      z-index: 999; 
    }
    .modal-card { 
      background: white; 
      padding: 25px; 
      border-radius: 14px; 
      width: 90%; 
      max-width: 350px; 
      text-align: center; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-card input { 
      width: 100%; 
      padding: 10px; 
      font-size: 16px; 
      margin: 15px 0 8px 0; 
      border: 2px solid #cbd5e1; 
      border-radius: 8px; 
      text-align: center; 
    }
    .modal-buttons { 
      display: flex; 
      gap: 10px; 
      justify-content: center; 
      margin-top: 10px; 
    }
    .btn-confirm { 
      background: #16a34a; 
      color: white; 
      padding: 10px 20px; 
      border: none; 
      border-radius: 8px; 
      font-weight: bold; 
      cursor: pointer; 
    }
    .btn-cancel { 
      background: #64748b; 
      color: white; 
      padding: 10px 20px; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
    }
    .error-msg { 
      color: #dc2626; 
      font-size: 13px; 
      display: none; 
      margin-bottom: 10px; 
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>📖 Reading Tracker App</h1>
      <button class="btn-guru" onclick="bukaModalPassword()">🔒 Rekod Guru</button>
    </header>

    <!-- SKRIN 1: HALAMAN UTAMA -->
    <div id="skrin-utama">
      <div class="welcome-card">
        <h2>Selamat Datang! 👋</h2>
        <p>Sila masukkan nama, pilih kelas, dan modul daripada senarai di bawah:</p>
        
        <div class="form-group">
          <label for="nama-murid">Nama Murid:</label>
          <input type="text" id="nama-murid" placeholder="Masukkan nama penuh" required>
        </div>
        
        <!-- DROP DOWN KELAS DARJAH 3 -->
        <div class="form-group">
          <label for="kelas-murid">Pilih Kelas:</label>
          <select id="kelas-murid" required>
            <option value="" disabled selected>-- Pilih Kelas --</option>
            <option value="3 ARIF">3 ARIF</option>
            <option value="3 BESTARI">3 BESTARI</option>
            <option value="3 CERDIK">3 CERDIK</option>
            <option value="3 DEDIKASI">3 DEDIKASI</option>
            <option value="3 ELIT">3 ELIT</option>
            <option value="3 FIRDAUS">3 FIRDAUS</option>
            <option value="3 GIGIH">3 GIGIH</option>
            <option value="3 HARMONI">3 HARMONI</option>
            <option value="3 INOVATIF">3 INOVATIF</option>
            <option value="3 JUARA">3 JUARA</option>
            <option value="3 KREATIF">3 KREATIF</option>
          </select>
        </div>

        <!-- DROP DOWN MODULE 1 HINGGA 10 -->
        <div class="form-group">
          <label for="select-modul">Pilih Modul Soalan:</label>
          <select id="select-modul">
            <option value="" disabled selected>-- Pilih Modul (1 - 10) --</option>
            <option value="1">MODULE 1</option>
            <option value="2">MODULE 2</option>
            <option value="3">MODULE 3</option>
            <option value="4">MODULE 4</option>
            <option value="5">MODULE 5</option>
            <option value="6">MODULE 6</option>
            <option value="7">MODULE 7</option>
            <option value="8">MODULE 8</option>
            <option value="9">MODULE 9</option>
            <option value="10">MODULE 10</option>
          </select>
        </div>

        <button class="btn-start" onclick="mulaKuizDropdown()">Mula Kuiz 🚀</button>
      </div>
    </div>

    <!-- SKRIN 2: PAPARAN KUIZ -->
    <div id="skrin-kuiz" style="display: none;">
      <div class="quiz-header-info">
        <div class="student-detail">
          👤 <b>Nama:</b> <span id="papar-nama"></span> | 
          🏫 <b>Kelas:</b> <span id="papar-kelas"></span> | 
          📌 <b>Topik:</b> MODULE <span id="papar-set"></span>
        </div>
        <button class="btn-back" onclick="kembaliKeUtama()">⬅ Tukar Modul</button>
      </div>

      <div id="quiz-box"></div>

      <button class="btn-submit" onclick="semakJawapan()">Hantar Jawapan</button>

      <div id="result-box" class="result-box">
        <h2 id="result-score"></h2>
        <p id="result-message"></p>
        <p id="sending-status" style="font-weight: bold; color: #0284c7;"></p>
      </div>
    </div>
  </div>

  <!-- POPUP PASSWORD GURU -->
  <div id="modal-password" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <h3>🔒 Akses Rekod Guru</h3>
      <p>Sila masukkan kata laluan guru:</p>
      <input type="password" id="input-password" placeholder="Masukkan kata laluan" onkeypress="semakEnter(event)">
      <p id="password-error" class="error-msg">Kata laluan salah! Sila cuba lagi.</p>
      <div class="modal-buttons">
        <button class="btn-confirm" onclick="sahkanPassword()">Masuk</button>
        <button class="btn-cancel" onclick="tutupModalPassword()">Batal</button>
      </div>
    </div>
  </div>

<script>
  const KATA_LALUAN_GURU = "guru123";
  const PAUTAN_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxCd2cvXVKr2ZuUswrZWVg19spQVISjI97vzHz8nPhLi5rwhd4ydhHHEfnJMGWH1kD7/exec";

  let allQuestions = [];
  let currentSet = 1;
  let selectedAnswers = {};

  // Memuat turun soalan daripada questions.json
  fetch('questions.json')
    .then(res => {
      if (!res.ok) {
        throw new Error('Fail questions.json tidak dijumpai.');
      }
      return res.json();
    })
    .then(data => {
      allQuestions = data;
      console.log('questions.json berjaya dimuat turun:', allQuestions);
    })
    .catch(err => {
      console.error('Ralat membaca questions.json:', err);
    });

  function mulaKuizDropdown() {
    const nama = document.getElementById('nama-murid').value.trim();
    const kelas = document.getElementById('kelas-murid').value;
    const selectedModul = document.getElementById('select-modul').value;

    if (!nama) {
      alert('Sila isi NAMA anda terlebih dahulu!');
      return;
    }

    if (!kelas) {
      alert('Sila pilih KELAS daripada senarai terlebih dahulu!');
      return;
    }

    if (!selectedModul) {
      alert('Sila pilih MODUL daripada senarai drop-down terlebih dahulu!');
      return;
    }

    if (allQuestions.length === 0) {
      alert('Soalan masih dalam proses dimuat turun atau fail questions.json tidak dijumpai. Sila muat semula (refresh) halaman.');
      return;
    }

    pilihTopik(parseInt(selectedModul));
  }

  function pilihTopik(setNo) {
    const nama = document.getElementById('nama-murid').value.trim();
    const kelas = document.getElementById('kelas-murid').value;

    currentSet = setNo;
    selectedAnswers = {};
    document.getElementById('result-box').style.display = 'none';

    document.getElementById('papar-nama').innerText = nama;
    document.getElementById('papar-kelas').innerText = kelas;
    document.getElementById('papar-set').innerText = setNo;

    document.getElementById('skrin-utama').style.display = 'none';
    document.getElementById('skrin-kuiz').style.display = 'block';

    paparSetSoalan(setNo);
  }

  function kembaliKeUtama() {
    document.getElementById('skrin-kuiz').style.display = 'none';
    document.getElementById('skrin-utama').style.display = 'block';
  }

  function paparSetSoalan(setNo) {
    const setData = allQuestions.find(s => String(s.set) === String(setNo));
    const quizBox = document.getElementById('quiz-box');
    quizBox.innerHTML = '';

    if (!setData) {
      quizBox.innerHTML = '<p style="text-align:center; padding: 20px; font-weight: bold; color: #dc2626;">Soalan untuk MODULE ' + setNo + ' belum wujud dalam questions.json.</p>';
      return;
    }

    setData.questions.forEach((q, qIndex) => {
      const qCard = document.createElement('div');
      qCard.className = 'question-card';

      let optionsHTML = '';
      q.options.forEach(opt => {
        optionsHTML += `
          <div class="option-card" id="opt-${qIndex}-${opt.label}" onclick="pilihJawapan(${qIndex}, '${opt.label}')">
            <span class="option-label">(${opt.label})</span>
            <img src="${opt.image}" class="option-img" alt="Pilihan ${opt.label}">
          </div>
        `;
      });

      qCard.innerHTML = `
        <div class="question-title">${q.no}. ${q.sentence}</div>
        <div class="options-grid">${optionsHTML}</div>
      `;
      quizBox.appendChild(qCard);
    });
  }

  function pilihJawapan(qIndex, label) {
    selectedAnswers[qIndex] = label;

    const optionCards = document.querySelectorAll(`[id^="opt-${qIndex}-"]`);
    optionCards.forEach(card => card.classList.remove('selected'));

    const selectedCard = document.getElementById(`opt-${qIndex}-${label}`);
    if (selectedCard) {
      selectedCard.classList.add('selected');
    }
  }

  function semakJawapan() {
    const setData = allQuestions.find(s => String(s.set) === String(currentSet));
    if (!setData) return;

    let score = 0;
    const total = setData.questions.length;

    if (Object.keys(selectedAnswers).length < total) {
      alert('Sila jawab semua soalan sebelum menghantar!');
      return;
    }

    setData.questions.forEach((q, qIndex) => {
      const userAns = selectedAnswers[qIndex];
      const correctOpt = q.options.find(o => o.is_correct);
      if (correctOpt && userAns === correctOpt.label) {
        score++;
      }
    });

    const nama = document.getElementById('nama-murid').value.trim();
    const kelas = document.getElementById('kelas-murid').value;

    const resultBox = document.getElementById('result-box');
    const resultScore = document.getElementById('result-score');
    const resultMessage = document.getElementById('result-message');
    const sendingStatus = document.getElementById('sending-status');

    resultScore.innerText = `Markah Anda: ${score} / ${total}`;
    if (score === total) {
      resultMessage.innerText = 'Tahniah! Semua jawapan anda betul! 🎉';
    } else {
      resultMessage.innerText = 'Syabas! Cuba lagi untuk dapatkan markah penuh!';
    }

    resultBox.style.display = 'block';
    sendingStatus.innerText = "Hantar keputusan ke rekod guru...";

    hantarDataKeGoogleSheet(nama, kelas, currentSet, score, total);
  }

  function hantarDataKeGoogleSheet(nama, kelas, set, score, total) {
    const formData = new URLSearchParams();
    formData.append('nama', nama);
    formData.append('kelas', kelas);
    formData.append('set', set);
    formData.append('markah', score);
    formData.append('jumlah', total);
    formData.append('peratus', Math.round((score / total) * 100));

    fetch(PAUTAN_APPS_SCRIPT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded'
      },
      body: formData.toString()
    })
    .then(() => {
      document.getElementById('sending-status').innerText = "✅ Keputusan berjaya disimpan dalam rekod guru!";
    })
    .catch(err => {
      console.error('Ralat hantar data:', err);
      document.getElementById('sending-status').innerText = "⚠️ Keputusan dipaparkan (Ralat sambungan rekod).";
    });
  }

  /* LOGIK MODAL KATA LALUAN GURU */
  function bukaModalPassword() {
    document.getElementById('input-password').value = '';
    document.getElementById('password-error').style.display = 'none';
    document.getElementById('modal-password').style.display = 'flex';
    document.getElementById('input-password').focus();
  }

  function tutupModalPassword() {
    document.getElementById('modal-password').style.display = 'none';
  }

  function sahkanPassword() {
    const input = document.getElementById('input-password').value;
    if (input === KATA_LALUAN_GURU) {
      tutupModalPassword();
      window.location.href = "dashboard.html"; // Terus bawa ke dashboard.html
    } else {
      document.getElementById('password-error').style.display = 'block';
    }
  }

  function semakEnter(event) {
    if (event.key === 'Enter') {
      sahkanPassword();
    }
  }
</script>
</body>
</html>

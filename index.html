<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Tracker App</title>
  <style>
    * { 
      box-sizing: border-box; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    }
    body { 
      background-color: #f0f9ff; 
      margin: 0; 
      padding: 20px; 
      color: #1e293b; 
    }
    .container { 
      max-width: 850px; 
      margin: 0 auto; 
      background: #ffffff; 
      padding: 25px; 
      border-radius: 16px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
    }
    
    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 3px solid #e2e8f0; 
      padding-bottom: 15px; 
      margin-bottom: 20px; 
    }
    h1 { 
      margin: 0; 
      font-size: 22px; 
      color: #0284c7; 
    }
    .btn-guru { 
      background-color: #4f46e5 !important; 
      color: white !important; 
      padding: 10px 18px; 
      border: none; 
      border-radius: 8px; 
      font-weight: bold; 
      cursor: pointer; 
      display: inline-block !important;
      font-size: 14px;
      box-shadow: 0 4px 6px rgba(79, 70, 229, 0.2);
    }
    .btn-guru:hover { 
      background-color: #4338ca !important; 
    }

    /* SKRIN 1: HALAMAN UTAMA */
    .welcome-card {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      padding: 25px;
      text-align: center;
    }
    .welcome-card h2 {
      color: #0369a1;
      margin-top: 0;
    }
    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }
    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      color: #334155;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      background-color: white;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: #0284c7;
    }

    .btn-start {
      width: 100%;
      padding: 14px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    /* SKRIN 2: PAPARAN KUIZ */
    .quiz-header-info {
      background: #e0f2fe;
      border: 2px solid #0284c7;
      border-radius: 12px;
      padding: 15px 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .student-detail {
      font-size: 15px;
      color: #0369a1;
    }
    .btn-back {
      background: #64748b;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .question-card { 
      background: #f8fafc; 
      border: 1px solid #e2e8f0; 
      border-radius: 12px; 
      padding: 20px; 
      margin-bottom: 25px; 
    }
    .question-title { 
      font-size: 18px; 
      font-weight: bold; 
      margin-bottom: 15px; 
      color: #0f172a; 
    }
    .options-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
      gap: 15px; 
    }
    
    .option-card { 
      position: relative;
      border: 3px solid #cbd5e1; 
      border-radius: 14px; 
      padding: 12px; 
      text-align: center; 
      cursor: pointer; 
      background: white; 
    }
    .option-card.selected { 
      border-color: #16a34a !important; 
      background-color: #f0fdf4 !important; 
    }

    .option-label { 
      font-size: 18px; 
      font-weight: bold; 
      margin-bottom: 8px; 
      display: block; 
    }
    .option-img { 
      width: 100%; 
      height: 160px; 
      object-fit: contain; 
      border-radius: 8px; 
    }
    
    .btn-submit { 
      display: block; 
      width: 100%; 
      padding: 15px; 
      background: #16a34a; 
      color: white; 
      border: none; 
      border-radius: 10px; 
      font-size: 18px; 
      font-weight: bold; 
      cursor: pointer; 
      margin-top: 20px; 
    }

    .result-box { 
      display: none; 
      text-align: center; 
      padding: 20px; 
      background: #f0fdf4; 
      border: 2px solid #22c55e; 
      border-radius: 12px; 
      margin-top: 20px; 
    }

    /* KOTAK INPUT PASSWORD TEBAL & JELAS */
    .modal-overlay { 
      position: fixed; 
      top: 0; left: 0; 
      width: 100vw; 
      height: 100vh; 
      background: rgba(15, 23, 42, 0.75); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      z-index: 99999; 
    }
    .modal-card { 
      background: #ffffff; 
      padding: 30px; 
      border-radius: 16px; 
      width: 90%; 
      max-width: 380px; 
      text-align: center; 
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      border: 2px solid #cbd5e1;
    }
    .modal-card h3 {
      margin-top: 0;
      color: #1e293b;
      font-size: 20px;
    }
    .input-pass-box { 
      width: 100%; 
      padding: 14px; 
      font-size: 18px; 
      margin: 15px 0 10px 0; 
      border: 2px solid #0284c7; 
      border-radius: 10px; 
      text-align: center; 
      letter-spacing: 2px;
      outline: none;
    }
    .modal-buttons { 
      display: flex; 
      gap: 10px; 
      justify-content: center; 
      margin-top: 15px; 
    }
    .btn-confirm { 
      background: #16a34a; 
      color: white; 
      padding: 12px 24px; 
      border: none; 
      border-radius: 8px; 
      font-weight: bold; 
      font-size: 15px;
      cursor: pointer; 
      flex: 1;
    }
    .btn-cancel { 
      background: #64748b; 
      color: white; 
      padding: 12px 24px; 
      border: none; 
      border-radius: 8px; 
      font-size: 15px;
      cursor: pointer; 
      flex: 1;
    }
    .error-msg { 
      color: #dc2626; 
      font-size: 14px; 
      display: none; 
      margin-top: 5px; 
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>📖 Reading Tracker App</h1>
      <button type="button" class="btn-guru" onclick="paparkanBorangPassword()">🔒 Rekod Guru</button>
    </header>

    <!-- SKRIN 1: HALAMAN UTAMA -->
    <div id="skrin-utama">
      <div class="welcome-card">
        <h2>Selamat Datang! 👋</h2>
        <p>Sila masukkan nama, pilih kelas, dan modul daripada senarai di bawah:</p>
        
        <div class="form-group">
          <label for="nama-murid">Nama Murid:</label>
          <input type="text" id="nama-murid" placeholder="Masukkan nama penuh" required>
        </div>
        
        <div class="form-group">
          <label for="kelas-murid">Pilih Kelas:</label>
          <select id="kelas-murid" required>
            <option value="" disabled selected>-- Pilih Kelas --</option>
            <option value="3 ARIF">3 ARIF</option>
            <option value="3 BESTARI">3 BESTARI</option>
            <option value="3 CERDIK">3 CERDIK</option>
            <option value="3 DEDIKASI">3 DEDIKASI</option>
            <option value="3 ELIT">3 ELIT</option>
            <option value="3 FIRDAUS">3 FIRDAUS</option>
            <option value="3 GIGIH">3 GIGIH</option>
            <option value="3 HARMONI">3 HARMONI</option>
            <option value="3 INOVATIF">3 INOVATIF</option>
            <option value="3 JUARA">3 JUARA</option>
            <option value="3 KREATIF">3 KREATIF</option>
          </select>
        </div>

        <div class="form-group">
          <label for="select-modul">Pilih Modul Soalan:</label>
          <select id="select-modul">
            <option value="" disabled selected>-- Pilih Modul (1 - 10) --</option>
            <option value="1">MODULE 1</option>
            <option value="2">MODULE 2</option>
            <option value="3">MODULE 3</option>
            <option value="4">MODULE 4</option>
            <option value="5">MODULE 5</option>
            <option value="6">MODULE 6</option>
            <option value="7">MODULE 7</option>
            <option value="8">MODULE 8</option>
            <option value="9">MODULE 9</option>
            <option value="10">MODULE 10</option>
          </select>
        </div>

        <button class="btn-start" onclick="mulaKuizDropdown()">Mula Kuiz 🚀</button>
      </div>
    </div>

    <!-- SKRIN 2: PAPARAN KUIZ -->
    <div id="skrin-kuiz" style="display: none;">
      <div class="quiz-header-info">
        <div class="student-detail">
          👤 <b>Nama:</b> <span id="papar-nama"></span> | 
          🏫 <b>Kelas:</b> <span id="papar-kelas"></span> | 
          📌 <b>Topik:</b> MODULE <span id="papar-set"></span>
        </div>
        <button class="btn-back" onclick="kembaliKeUtama()">⬅ Tukar Modul</button>
      </div>

      <div id="quiz-box"></div>

      <button class="btn-submit" onclick="semakJawapan()">Hantar Jawapan</button>

      <div id="result-box" class="result-box">
        <h2 id="result-score"></h2>
        <p id="result-message"></p>
        <p id="sending-status" style="font-weight: bold; color: #0284c7;"></p>
      </div>
    </div>
  </div>

  <!-- BORANG TAIP PASSWORD GURU -->
  <div id="kotak-password-guru" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <h3>🔑 Kata Laluan Guru</h3>
      <p style="margin-bottom:0; color: #64748b;">Sila taip kata laluan untuk ke Rekod Guru:</p>
      
      <input type="password" id="input-password" class="input-pass-box" placeholder="Taip di sini..." autocomplete="off">
      <div id="password-error" class="error-msg">❌ Kata laluan salah!</div>

      <div class="modal-buttons">
        <button type="button" class="btn-confirm" onclick="semakKataLaluan()">Masuk</button>
        <button type="button" class="btn-cancel" onclick="tutupBorangPassword()">Batal</button>
      </div>
    </div>
  </div>

<script>
  const KATA_LALUAN_BENAR = "guru123";
  const PAUTAN_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxCd2cvXVKr2ZuUswrZWVg19spQVISjI97vzHz8nPhLi5rwhd4ydhHHEfnJMGWH1kD7/exec";

  let allQuestions = [];
  let currentSet = 1;
  let selectedAnswers = {};

  fetch('questions.json')
    .then(res => res.json())
    .then(data => { allQuestions = data; })
    .catch(err => console.error('Ralat questions.json:', err));

  function mulaKuizDropdown() {
    const nama = document.getElementById('nama-murid').value.trim();
    const kelas = document.getElementById('kelas-murid').value;
    const selectedModul = document.getElementById('select-modul').value;

    if (!nama || !kelas || !selectedModul) {
      alert('Sila isi NAMA, KELAS, dan MODUL terlebih dahulu!');
      return;
    }
    pilihTopik(parseInt(selectedModul));
  }

  function pilihTopik(setNo) {
    const nama = document.getElementById('nama-murid').value.trim();
    const kelas = document.getElementById('kelas-murid').value;

    currentSet = setNo;
    selectedAnswers = {};
    document.getElementById('result-box').style.display = 'none';

    document.getElementById('papar-nama').innerText = nama;
    document.getElementById('papar-kelas').innerText = kelas;
    document.getElementById('papar-set').innerText = setNo;

    document.getElementById('skrin-utama').style.display = 'none';
    document.getElementById('skrin-kuiz').style.display = 'block';

    paparSetSoalan(setNo);
  }

  function kembaliKeUtama() {
    document.getElementById('skrin-kuiz').style.display = 'none';
    document.getElementById('skrin-utama').style.display = 'block';
  }

  function paparSetSoalan(setNo) {
    const setData = allQuestions.find(s => String(s.set) === String(setNo));
    const quizBox = document.getElementById('quiz-box');
    quizBox.innerHTML = '';

    if (!setData) {
      quizBox.innerHTML = '<p style="text-align:center; padding: 20px; font-weight: bold; color: #dc2626;">Soalan belum wujud.</p>';
      return;
    }

    setData.questions.forEach((q, qIndex) => {
      const qCard = document.createElement('div');
      qCard.className = 'question-card';

      let optionsHTML = '';
      q.options.forEach(opt => {
        optionsHTML += `
          <div class="option-card" id="opt-${qIndex}-${opt.label}" onclick="pilihJawapan(${qIndex}, '${opt.label}')">
            <span class="option-label">(${opt.label})</span>
            <img src="${opt.image}" class="option-img" alt="Pilihan ${opt.label}">
          </div>
        `;
      });

      qCard.innerHTML = `
        <div class="question-title">${q.no}. ${q.sentence}</div>
        <div class="options-grid">${optionsHTML}</div>
      `;
      quizBox.appendChild(qCard);
    });
  }

  function pilihJawapan(qIndex, label) {
    selectedAnswers[qIndex] = label;
    const optionCards = document.querySelectorAll(`[id^="opt-${qIndex}-"]`);
    optionCards.forEach(card => card.classList.remove('selected'));
    document.getElementById(`opt-${qIndex}-${label}`).classList.add('selected');
  }

  function semakJawapan() {
    const setData = allQuestions.find(s => String(s.set) === String(currentSet));
    if (!setData) return;

    let score = 0;
    const total = setData.questions.length;

    if (Object.keys(selectedAnswers).length < total) {
      alert('Sila jawab semua soalan!');
      return;
    }

    setData.questions.forEach((q, qIndex) => {
      const userAns = selectedAnswers[qIndex];
      const correctOpt = q.options.find(o => o.is_correct);
      if (correctOpt && userAns === correctOpt.label) score++;
    });

    const nama = document.getElementById('nama-murid').value.trim();
    const kelas = document.getElementById('kelas-murid').value;

    document.getElementById('result-score').innerText = `Markah Anda: ${score} / ${total}`;
    document.getElementById('result-message').innerText = score === total ? 'Tahniah! 🎉' : 'Syabas! Cuba lagi!';
    document.getElementById('result-box').style.display = 'block';
    document.getElementById('sending-status').innerText = "Hantar keputusan ke rekod guru...";

    hantarDataKeGoogleSheet(nama, kelas, currentSet, score, total);
  }

  function hantarDataKeGoogleSheet(nama, kelas, set, score, total) {
    const formData = new URLSearchParams();
    formData.append('nama', nama);
    formData.append('kelas', kelas);
    formData.append('set', set);
    formData.append('markah', score);
    formData.append('jumlah', total);
    formData.append('peratus', Math.round((score / total) * 100));

    fetch(PAUTAN_APPS_SCRIPT, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: formData.toString()
    }).then(() => {
      document.getElementById('sending-status').innerText = "✅ Keputusan berjaya disimpan!";
    });
  }

  /* FUNGSI PAPARKAN RUANG TAIP KATA LALUAN */
  function paparkanBorangPassword() {
    const box = document.getElementById('kotak-password-guru');
    const input = document.getElementById('input-password');
    
    input.value = '';
    document.getElementById('password-error').style.display = 'none';
    box.style.display = 'flex';
    
    setTimeout(() => { input.focus(); }, 100);
  }

  function tutupBorangPassword() {
    document.getElementById('kotak-password-guru').style.display = 'none';
  }

  function semakKataLaluan() {
    const taipPass = document.getElementById('input-password').value;
    
    if (taipPass === KATA_LALUAN_BENAR) {
      tutupBorangPassword();
      window.location.href = "dashboard.html";
    } else {
      document.getElementById('password-error').style.display = 'block';
    }
  }

  // Boleh tekan 'Enter' di papan kekunci untuk hantar kata laluan
  document.getElementById('input-password').addEventListener('keyup', function(e) {
    if (e.key === 'Enter') {
      semakKataLaluan();
    }
  });
</script>
</body>
</html>
